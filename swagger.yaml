security:
  - OAuth2: []
  - BearerAuth: []
  - BasicAuth: []

components:
  securitySchemes:
    OAuth2:
      type: oauth2
      description: |
        OAuth 2.0 authentication.

        **Supported Grant Types:**
        - Client Credentials - For server-to-server authentication
        - Personal Access Tokens - For user-specific API access
        - Authorization Code

        **Token Endpoint:** `/oauth/token`

        **Usage:**
        ```
        Authorization: Bearer {access_token}
        ```
      flows:
        clientCredentials:
          tokenUrl: /oauth/token
          scopes: {}
        password:
          tokenUrl: /oauth/token
          scopes: {}

    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT (JSON Web Token) authentication.

        **Configuration:**
        - Algorithm: HS256 (HMAC-SHA256)
        - Token TTL: 60 minutes
        - Refresh TTL: 14 days

        **Obtaining a Token:**
        Use the `/v2/login` endpoint with username/password credentials.

        **Usage:**
        ```
        Authorization: Bearer {jwt_token}
        ```

        **Token Claims:**
        - `sub`: User ID
        - `iss`: Token issuer
        - `iat`: Issued at timestamp
        - `exp`: Expiration timestamp
        - `workspace`: Workspace identifier

    BasicAuth:
      type: http
      scheme: basic
      description: |
        HTTP Basic Authentication.

        **Usage:**
        ```
        Authorization: Basic base64(username:password)
        ```

        This method supports both direct user authentication and LDAP-based authentication
        when configured for the workspace.

  parameters:
    WorkspaceHeader:
      name: X-Workspace
      in: header
      required: true
      description: Workspace identifier for multi-tenant context
      schema:
        type: string
      example: "my-workspace"

    PageParam:
      name: page
      in: query
      description: Page number for pagination
      schema:
        type: integer
        default: 1
        minimum: 1

    PerPageParam:
      name: per_page
      in: query
      description: Number of items per page
      schema:
        type: integer
        default: 15
        minimum: 1
        maximum: 100

    SearchParam:
      name: search
      in: query
      description: Search term for filtering results
      schema:
        type: string

    SortParam:
      name: sort
      in: query
      description: Field to sort by
      schema:
        type: string

    OrderParam:
      name: order
      in: query
      description: Sort direction
      schema:
        type: string
        enum: [asc, desc]
        default: asc

  schemas:
    # Common Response Schemas
    Error:
      type: object
      properties:
        message:
          type: string
          description: Error message
        errors:
          type: object
          description: Validation errors by field
          additionalProperties:
            type: array
            items:
              type: string
      required:
        - message

    PaginationMeta:
      type: object
      properties:
        current_page:
          type: integer
        from:
          type: integer
        last_page:
          type: integer
        per_page:
          type: integer
        to:
          type: integer
        total:
          type: integer

    PaginationLinks:
      type: object
      properties:
        first:
          type: string
          format: uri
        last:
          type: string
          format: uri
        prev:
          type: string
          format: uri
          nullable: true
        next:
          type: string
          format: uri
          nullable: true

    # User Schemas
    User:
      type: object
      properties:
        id:
          type: integer
          description: User ID
        email:
          type: string
          format: email
          description: User email address
        username:
          type: string
          description: Username for login
        name:
          type: string
          description: User's first name
        surname:
          type: string
          nullable: true
          description: User's surname
        locale:
          type: string
          description: User's preferred locale
          example: "en"
        timezone:
          type: string
          description: User's timezone
          example: "America/Sao_Paulo"
        active:
          type: boolean
          description: Whether user is active
        type:
          type: string
          description: User type
          enum: [DEFAULT, ADMIN, EXTERNAL]
        process_designer:
          type: boolean
          description: Whether user can design BPM processes
        calendar_id:
          type: integer
          nullable: true
          description: Associated calendar ID
        avatar:
          type: string
          nullable: true
          description: URL to user avatar
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateUserRequest:
      type: object
      required:
        - email
        - username
        - name
        - password
      properties:
        email:
          type: string
          format: email
          description: User email address (must be unique)
        username:
          type: string
          description: Username for login (must be unique)
        name:
          type: string
          description: User's first name
        password:
          type: string
          format: password
          minLength: 8
          description: User password (minimum 8 characters)
        surname:
          type: string
          nullable: true
          description: User's surname
        locale:
          type: string
          description: User's preferred locale
        timezone:
          type: string
          description: User's timezone
        calendar_id:
          type: integer
          nullable: true
          description: Associated calendar ID
        type:
          type: string
          enum: [DEFAULT, ADMIN, EXTERNAL]
        process_designer:
          type: boolean
          default: false

    UpdateUserRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        username:
          type: string
        name:
          type: string
        password:
          type: string
          format: password
          minLength: 8
        surname:
          type: string
          nullable: true
        locale:
          type: string
        timezone:
          type: string
        calendar_id:
          type: integer
          nullable: true
        active:
          type: boolean
        type:
          type: string
          enum: [DEFAULT, ADMIN, EXTERNAL]
        process_designer:
          type: boolean

    # Organizational Unit Schemas
    OrganizationalUnit:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        type:
          type: string
        parent_id:
          type: integer
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ECM Schemas
    Folder:
      type: object
      properties:
        _id:
          type: string
          description: MongoDB ObjectId
        name:
          type: string
        parent_id:
          type: string
          nullable: true
        version_control:
          type: boolean
        created_by:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateFolderRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Folder name
        parent_id:
          type: string
          nullable: true
          description: Parent folder ID
        triggers:
          type: array
          description: Folder triggers
          items:
            type: object

    Document:
      type: object
      properties:
        _id:
          type: string
          description: MongoDB ObjectId
        title:
          type: string
        folder_id:
          type: string
        template_id:
          type: string
          nullable: true
        fields:
          type: object
          additionalProperties: true
        created_by:
          type: integer
        blocked:
          type: boolean
        blocked_by:
          type: integer
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateDocumentRequest:
      type: object
      required:
        - folder_id
      properties:
        title:
          type: string
          nullable: true
          description: Document title
        folder_id:
          type: string
          description: Target folder ID
        template_id:
          type: string
          nullable: true
          description: Template ID for document structure
        fields:
          type: object
          nullable: true
          additionalProperties: true
          description: Template field values
        form_files:
          type: array
          description: Form file IDs to attach
          items:
            type: string
        positionBox:
          type: string
          nullable: true
          description: Physical guard position box ID
        files:
          type: array
          description: Files to attach to document
          items:
            type: object
            required:
              - remote_path
              - name
              - file_type
              - file_size
            properties:
              remote_path:
                type: string
                description: S3 path of uploaded file
              name:
                type: string
                description: File name
              file_type:
                type: string
                description: MIME type
              file_size:
                type: integer
                description: File size in bytes
              creator:
                type: integer
                description: Creator user ID
              legal_validity:
                type: object
                description: Legal validity configuration
                properties:
                  certificate_id:
                    type: integer
                  title:
                    type: string
                  author:
                    type: string
                  keywords:
                    type: array
                    items:
                      type: string
                  scanning_location:
                    type: string
                  doc_type:
                    type: string

    File:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        file_type:
          type: string
        file_size:
          type: integer
        remote_path:
          type: string
        version:
          type: integer
        creator:
          type: integer
        created_at:
          type: string
          format: date-time

    Template:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        category:
          type: string
          nullable: true
        fields:
          type: array
          items:
            type: object
        active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Tag:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        color:
          type: string
        description:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    # BPM Schemas
    Process:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        category:
          type: string
          nullable: true
        generation:
          type: integer
          enum: [1, 2]
        diagram:
          type: object
        subprocess_only:
          type: boolean
        late_start:
          type: boolean
        debug:
          type: boolean
        calendar_id:
          type: integer
          nullable: true
        active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateProcessRequest:
      type: object
      required:
        - name
        - generation
      properties:
        name:
          type: string
          description: Process name
        generation:
          type: integer
          enum: [1, 2]
          description: Process generation (1 or 2)
        description:
          type: string
          nullable: true
        category:
          type: string
          nullable: true
        calendar_id:
          type: integer
          nullable: true
        subprocess_only:
          type: boolean
          default: false
        late_start:
          type: boolean
          default: false
        debug:
          type: boolean
          default: false
        case_title:
          type: string
          description: Template for case titles
        goal_min_value:
          type: integer
          nullable: true
        goal_max_value:
          type: integer
          nullable: true
        goal_unit:
          type: string
          nullable: true
        highlight_case_annotations_in_report:
          type: boolean
          default: false

    Case:
      type: object
      properties:
        _id:
          type: string
          description: MongoDB ObjectId
        number:
          type: string
          description: Case number
        process_id:
          type: integer
        title:
          type: string
        status:
          type: string
          enum: [ACTIVE, COMPLETED, CANCELLED]
        context:
          type: object
          additionalProperties: true
        created_by:
          type: integer
        urgent:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    StartCaseRequest:
      type: object
      required:
        - starting_stage
      properties:
        starting_stage:
          type: string
          description: ID of the initial stage
        context:
          type: object
          additionalProperties: true
          description: Initial case context variables
        data:
          type: object
          additionalProperties:
            type: object
          description: Initial step data keyed by step ID
        active:
          type: boolean
          default: true

    Task:
      type: object
      properties:
        id:
          type: string
        case_id:
          type: string
        stage_id:
          type: string
        process_id:
          type: integer
        status:
          type: string
          enum: [PENDING, CLAIMED, STARTED, COMPLETED, CANCELLED]
        assigned_to:
          type: integer
          nullable: true
        claimed_by:
          type: integer
          nullable: true
        started_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        due_date:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    Stage:
      type: object
      properties:
        id:
          type: string
        process_id:
          type: integer
        name:
          type: string
        type:
          type: string
        description:
          type: string
          nullable: true

    eForm:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        category:
          type: string
          nullable: true
        fields:
          type: array
          items:
            type: object
        active:
          type: boolean
        created_at:
          type: string
          format: date-time

    # DSS Schemas
    SignatureRequest:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        status:
          type: string
          enum: [PENDING, IN_PROGRESS, COMPLETED, CANCELLED, EXPIRED]
        notify:
          type: boolean
        store_results:
          type: boolean
        flow_actions:
          type: array
          items:
            $ref: "#/components/schemas/FlowAction"
        observers:
          type: array
          items:
            $ref: "#/components/schemas/Observer"
        created_by:
          type: integer
        created_at:
          type: string
          format: date-time

    CreateSignatureRequest:
      type: object
      required:
        - flow_actions
      properties:
        title:
          type: string
        notify:
          type: boolean
          default: true
        store_results:
          type: boolean
          default: true
        ecm_document_destination:
          type: string
          nullable: true
          description: ECM document ID for storing signed files
        ecm_files:
          type: array
          description: ECM files to sign (required if no form_files or remote_files)
          items:
            type: object
            required:
              - ecm_document_id
              - file_id
            properties:
              ecm_document_id:
                type: string
              file_id:
                type: string
        form_files:
          type: array
          description: Form file IDs to sign
          items:
            type: string
        remote_files:
          type: array
          description: Remote files to sign
          items:
            type: object
            required:
              - name
              - display_name
              - remote_path
            properties:
              name:
                type: string
              display_name:
                type: string
              remote_path:
                type: string
        bpm_task_id:
          type: string
          description: Associated BPM task ID
        bpm_case_id:
          type: string
          description: Associated BPM case ID
        bpm_step_id:
          type: string
          description: Associated BPM step ID
        flow_actions:
          type: array
          items:
            $ref: "#/components/schemas/FlowActionInput"
        observers:
          type: array
          items:
            $ref: "#/components/schemas/ObserverInput"

    FlowAction:
      type: object
      properties:
        identifier:
          type: string
        type:
          type: string
          enum: [SIGN, APPROVE, WITNESS]
        step:
          type: integer
        status:
          type: string
        user:
          type: object
          properties:
            name:
              type: string
            email:
              type: string
            identifier:
              type: string

    FlowActionInput:
      type: object
      required:
        - type
        - user
      properties:
        type:
          type: string
          enum: [SIGN, APPROVE, WITNESS]
        step:
          type: integer
          default: 1
        allowEsign:
          type: boolean
          default: false
        user:
          type: object
          required:
            - name
            - email
          properties:
            name:
              type: string
            identifier:
              type: string
              description: CPF (11 digits) for Brazilian users
            email:
              type: string
              format: email
        prePositionedMarks:
          type: array
          items:
            type: object
            required:
              - type
              - fileId
              - fileName
              - pageNumber
              - topLeftX
              - topLeftY
            properties:
              type:
                type: string
              fileId:
                type: string
              fileName:
                type: string
              pageNumber:
                type: integer
                minimum: 1
              topLeftX:
                type: number
              topLeftY:
                type: number
              width:
                type: number
              height:
                type: number

    Observer:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email

    ObserverInput:
      type: object
      required:
        - name
        - email
      properties:
        name:
          type: string
        email:
          type: string
          format: email

    # Collaboration Schemas
    Collaboration:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
          nullable: true
        status:
          type: string
        created_by:
          type: integer
        created_at:
          type: string
          format: date-time

    CollaborationMessage:
      type: object
      properties:
        id:
          type: integer
        collaboration_id:
          type: integer
        user_id:
          type: integer
        content:
          type: string
        created_at:
          type: string
          format: date-time

    CollaborationUser:
      type: object
      properties:
        id:
          type: integer
        collaboration_id:
          type: integer
        user_id:
          type: integer
        role:
          type: string
          enum: [OWNER, MEMBER, VIEWER]
        created_at:
          type: string
          format: date-time

    CollaborationFile:
      type: object
      properties:
        id:
          type: integer
        collaboration_id:
          type: integer
        message_id:
          type: integer
          nullable: true
        filename:
          type: string
        mime_type:
          type: string
        size:
          type: integer
          description: File size in bytes
        user_id:
          type: integer
        created_at:
          type: string
          format: date-time

    # BPM Document Schemas
    BPMDocument:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          description: Document type name
        description:
          type: string
          nullable: true
          description: Document type description
        required:
          type: boolean
          description: Whether document is required for process
        allow_multiple:
          type: boolean
          description: Whether multiple documents can be attached
        process_id:
          type: integer
          nullable: true
          description: Associated process ID
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # Calendar Schemas
    Calendar:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        timezone:
          type: string
        active:
          type: boolean

    Holiday:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        date:
          type: string
          format: date
        type:
          type: string
        recurrent:
          type: boolean

    # Integration Schemas
    Integration:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        type:
          type: string
        config:
          type: object
        active:
          type: boolean

    # Custom Table Schemas
    CustomTable:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        table_name:
          type: string
        columns:
          type: array
          items:
            type: object
        created_at:
          type: string
          format: date-time

    # Authentication Schemas
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string
          format: password

    LoginResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT access token
        token_type:
          type: string
          example: bearer
        expires_in:
          type: integer
          description: Token expiration time in seconds
        user:
          $ref: "#/components/schemas/User"

    TwoFactorVerifyRequest:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          description: 6-digit TOTP code
        token:
          type: string
          description: Temporary 2FA token from login

    OAuthClient:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        secret:
          type: string
        redirect:
          type: string
        personal_access_client:
          type: boolean
        password_client:
          type: boolean
        revoked:
          type: boolean
        created_at:
          type: string
          format: date-time

  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            message: "Unauthenticated."

    Forbidden:
      description: Access forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            message: "This action is unauthorized."

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            message: "Resource not found."

    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            message: "The given data was invalid."
            errors:
              email:
                - "The email field is required."

paths:
  # ============================================
  # AUTHENTICATION
  # ============================================
  /login:
    post:
      tags:
        - Authentication
      summary: Login with password
      description: Authenticate user with username/password credentials and receive a JWT token
      operationId: loginWithPassword
      security: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Successful login
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
    get:
      tags:
        - Authentication
      summary: Get current user info
      description: Returns information about the currently authenticated user
      operationId: getLogin
      responses:
        "200":
          description: Current user information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /logout:
    post:
      tags:
        - Authentication
      summary: Logout
      description: Invalidate the current authentication token
      operationId: logout
      responses:
        "200":
          description: Successfully logged out
        "401":
          $ref: "#/components/responses/Unauthorized"

  /oauth/personal-access-tokens:
    get:
      tags:
        - Authentication
      summary: List personal access tokens
      description: List all personal access tokens for the current user
      operationId: listPersonalAccessTokens
      responses:
        "200":
          description: List of tokens
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    name:
                      type: string
                    scopes:
                      type: array
                      items:
                        type: string
                    created_at:
                      type: string
                      format: date-time
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      tags:
        - Authentication
      summary: Create personal access token
      description: Create a new personal access token
      operationId: createPersonalAccessToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                scopes:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: Token created
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                    description: The plain-text token (only shown once)
                  token:
                    type: object
                    properties:
                      id:
                        type: string
                      name:
                        type: string
        "401":
          $ref: "#/components/responses/Unauthorized"

  /oauth/personal-access-tokens/{token_id}:
    delete:
      tags:
        - Authentication
      summary: Revoke personal access token
      description: Revoke a personal access token
      operationId: revokePersonalAccessToken
      parameters:
        - name: token_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Token revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ============================================
  # USERS
  # ============================================
  /users:
    get:
      tags:
        - Users
      summary: List users
      description: Get a paginated list of users in the workspace
      operationId: listUsers
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PerPageParam"
        - $ref: "#/components/parameters/SearchParam"
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/User"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
                  links:
                    $ref: "#/components/schemas/PaginationLinks"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      tags:
        - Users
      summary: Create user
      description: Create a new user in the workspace
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

  /users/me:
    get:
      tags:
        - Users
      summary: Get current user
      description: Get the currently authenticated user's profile
      operationId: getCurrentUser
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

    put:
      tags:
        - Users
      summary: Update current user
      description: Update the currently authenticated user's profile
      operationId: updateCurrentUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

  /users/active:
    get:
      tags:
        - Users
      summary: List active users
      description: Get all active users in the workspace
      operationId: listActiveUsers
      responses:
        "200":
          description: List of active users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users/{user}:
    get:
      tags:
        - Users
      summary: Get user
      description: Get a specific user by ID
      operationId: getUser
      parameters:
        - name: user
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      tags:
        - Users
      summary: Update user
      description: Update a specific user
      operationId: updateUser
      parameters:
        - name: user
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

    delete:
      tags:
        - Users
      summary: Delete user
      description: Delete a specific user
      operationId: deleteUser
      parameters:
        - name: user
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: User deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /users/{user}/avatar:
    post:
      tags:
        - Users
      summary: Update user avatar
      description: Upload a new avatar for the user
      operationId: updateUserAvatar
      parameters:
        - name: user
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - avatar
              properties:
                avatar:
                  type: string
                  format: binary
      responses:
        "200":
          description: Avatar updated
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /users/email/{email}:
    get:
      tags:
        - Users
      summary: Get user by email
      description: Find a user by email address
      operationId: getUserByEmail
      parameters:
        - name: email
          in: path
          required: true
          schema:
            type: string
            format: email
      responses:
        "200":
          description: User details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

