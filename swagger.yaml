      operationId: deleteOrganizationalUnit
      parameters:
        - name: organizationalUnit
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Organizational unit deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /organizationalUnits/{organizationalUnit}/users:
