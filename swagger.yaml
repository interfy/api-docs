        - ECM - Folders
      summary: Delete folder
      description: Soft delete a folder
      operationId: deleteFolder
      parameters:
        - name: folder
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Folder deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /folders/{folder}/children:
    get:
      tags:
        - ECM - Folders
      summary: Get folder children
      description: Get child folders and documents
      operationId: getFolderChildren
      parameters:
        - name: folder
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Folder children
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /folders/{folder}/documents:
    get:
      tags:
        - ECM - Folders
      summary: List folder documents
      description: Get all documents in a folder
      operationId: listFolderDocuments
      parameters:
        - name: folder
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PerPageParam"
      responses:
        "200":
          description: List of documents
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /folders/{folder}/authorizations:
    get:
      tags:
        - ECM - Folders
      summary: List folder authorizations
      description: Get all authorizations for a folder
      operationId: listFolderAuthorizations
      parameters:
        - name: folder
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of authorizations
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    post:
      tags:
        - ECM - Folders
      summary: Create folder authorization
      description: Create a new authorization for a folder
      operationId: createFolderAuthorization
      parameters:
        - name: folder
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - entity_type
                - entity_id
                - permissions
              properties:
                entity_type:
                  type: string
                  enum: [user, organizational_unit]
                entity_id:
                  type: integer
                permissions:
                  type: object
                  properties:
                    read:
                      type: boolean
                    write:
                      type: boolean
                    delete:
                      type: boolean
                    manage:
                      type: boolean
      responses:
        "201":
          description: Authorization created
        "401":
          $ref: "#/components/responses/Unauthorized"
