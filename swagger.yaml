openapi: 3.0.0
info:
  title: Interfy API
  description: |
    # Interfy API Documentation

    Interfy API is a comprehensive multi-tenant SaaS platform providing enterprise solutions for:
    - **BPM** - Business Process Management (workflows, tasks, cases)
    - **ECM** - Electronic Content Management (documents, folders, files, templates)
    - **DSS** - Digital Signature System (digital signatures)
    - **Collaboration** - Team collaboration and messaging
    - **ADMIN** - Administrative functions and workspace management

    ## Multi-Tenant Architecture

    Use `https://api.interfy.io` as the server URL and the complete operation paths shown below, such as
    `POST /api/v2/ecm/documents`. Do not insert another `/v2` between the server URL and the operation path.

    The API can also be accessed using the base URL of the Workspace you want to use (the same URL used in the browser).
    When using `https://api.interfy.io`, the `X-Workspace` header *must be included in every workspace-scoped request*.

    Every API request operates within a **workspace context** that isolates tenant data. The workspace is resolved from:
    - `X-Workspace` HTTP header (preferred). This header follows the following format: {domain}-{workspaceName}. As an example, for the workspace at dev.interfy.io, the header would be "interfy-dev".
    - JWT token `workspace` claim
    - Domain mapping

    **Critical**: All authenticated API calls must include workspace identification.

    ## Five-minute quickstart

    See [`docs/API_QUICKSTART.md`](https://github.com/interfy/api-docs/blob/master/QUICKSTART.md) for copy-ready authentication,
    BPM, ECM, pagination, upload, and troubleshooting examples.

    ## Rate Limiting

    API requests are rate-limited per workspace and user. Standard limits apply to most endpoints.
    Upload endpoints have separate rate limits.
