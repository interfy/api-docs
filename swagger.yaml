            type: integer
      responses:
        "200":
          description: Organizational unit details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationalUnit"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      tags:
        - Organizational Units
      summary: Update organizational unit
      description: Update a specific organizational unit
      operationId: updateOrganizationalUnit
      parameters:
        - name: organizationalUnit
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
